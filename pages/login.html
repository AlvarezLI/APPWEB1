<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RODEX — Iniciar sesión</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <nav class="navbar">
    <a href="gate.html" class="nav-brand" aria-label="RODEX — Inicio">
      <svg class="nav-logo" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="30" height="30" rx="7" fill="#0B1220"/>
        <path d="M8 9l5 6-5 6" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 9l5 6-5 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nav-brand-name">Rodex</span>
    </a>
    <ul class="nav-links">
      <li><a href="gate.html">Inicio</a></li>
      <li><a href="autos.html">Autos</a></li>
      <li><a href="motos.html">Motos</a></li>
      <li><a href="cuatriciclos.html">Cuatriciclos</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a href="register.html" class="btn-logout">Crear cuenta</a>
  </nav>

  <main>
    <div class="auth-wrap">

      <!-- Panel del formulario -->
      <div class="auth-panel">
        <div class="auth-form-wrap">

          <p class="auth-eyebrow">Bienvenido de nuevo</p>
          <h1 class="auth-title">Iniciar sesión</h1>
          <p class="auth-subtitle">Accedé a tu cuenta para ver el catálogo y tu carrito.</p>

          <form id="loginForm" novalidate>

            <div class="form-field">
              <label class="form-label" for="email">Correo electrónico</label>
              <input
                class="form-input"
                type="email"
                id="email"
                name="email"
                placeholder="tu@correo.com"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-field">
              <label class="form-label" for="password">Contraseña</label>
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>

            <p class="form-error" id="loginError"></p>

          </form>

          <div class="form-divider"></div>

          <p class="auth-footer">
            ¿No tenés cuenta?
            <a href="register.html">Registrate acá</a>
          </p>

        </div>
      </div>

      <!-- Panel visual -->
      <div class="auth-visual" aria-hidden="true">
        <p class="auth-visual-text">
          Rodex<br/>
          Motors<br/>
          Store
        </p>
      </div>

    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script>
    /* Si ya hay sesión activa no tiene sentido volver a loguearse */
    guardGuest();
    initNav();

    var form    = document.getElementById('loginForm');
    var errorEl = document.getElementById('loginError');
    var campos  = ['email', 'password'];

    function mostrarError(mensaje, idCampo) {
      errorEl.textContent = mensaje;
      errorEl.classList.add('visible');
      if (idCampo) {
        var campo = document.getElementById(idCampo);
        campo.classList.add('invalid');
        campo.focus();
      }
    }

    function limpiarError() {
      errorEl.classList.remove('visible');
      campos.forEach(function (id) {
        document.getElementById(id).classList.remove('invalid');
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      limpiarError();

      var email    = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;

      /* Chequeos en el cliente antes de consultar los usuarios guardados */
      if (!validarEmail(email))  return mostrarError('Ingresá un correo electrónico válido.', 'email');
      if (!password)             return mostrarError('Ingresá tu contraseña.', 'password');

      var resultado = authLogin(email, password);

      if (resultado.ok) {
        window.location.href = 'index.html';
      } else {
        mostrarError(resultado.error, 'password');
      }
    });

    campos.forEach(function (id) {
      document.getElementById(id).addEventListener('input', limpiarError);
    });
  </script>

</body>
</html>
