<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RODEX — Carrito</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <!-- NAVBAR (generado por navbar.js) -->
  <nav class="navbar"></nav>

  <main>
    <section class="cart-section">
      <div class="container">
        <p class="section-label">Mi carrito</p>

        <div id="cartEmpty" class="cart-empty" style="display:none">
          <p>Tu carrito está vacío.</p>
          <a href="index.html" class="hero-cta">Ir a la tienda</a>
        </div>

        <div id="cartTable" class="cart-table-wrap" style="display:none">
          <table class="cart-table">
            <thead>
              <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cartItems"></tbody>
          </table>
          <div class="cart-footer">
            <div class="cart-total-row">
              <span>Total</span>
              <span id="cartTotal">$0</span>
            </div>
            <div class="cart-actions">
              <button class="btn-ghost" id="btnVaciar">Vaciar carrito</button>
              <button class="btn-submit cart-checkout" id="btnComprar">Finalizar compra</button>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- MODAL DE COMPRA CONFIRMADA -->
  <div class="modal-overlay" id="checkoutModal" aria-modal="true" role="dialog" aria-labelledby="checkoutTitle">
    <div class="modal">
      <div class="modal-check" aria-hidden="true">&#10003;</div>
      <h2 class="modal-title" id="checkoutTitle">¡Compra confirmada!</h2>
      <p class="modal-body" id="checkoutBody">
        Gracias por tu compra en RODEX.<br/>
        Te vamos a contactar por correo para coordinar la entrega.
      </p>
      <button class="modal-btn" id="btnSeguir">Seguir comprando</button>
    </div>
  </div>

  <footer>
    <span class="footer-brand">Rodex</span>
    <span>&copy; 2026 RODEX. Todos los derechos reservados.</span>
  </footer>

  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/navbar.js"></script>
  <script>
    guardAuth();      /* ruta protegida */
    renderNavbar();

    var emptyEl = document.getElementById('cartEmpty');
    var tableEl = document.getElementById('cartTable');
    var bodyEl  = document.getElementById('cartItems');
    var totalEl = document.getElementById('cartTotal');

    function renderCart() {
      var items = cartGet();

      if (items.length === 0) {
        emptyEl.style.display = 'block';
        tableEl.style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      tableEl.style.display = 'block';

      bodyEl.innerHTML = items.map(function (item) {
        var id = escapeHtml(item.id);
        return '<tr class="cart-row">' +
          '<td class="cart-name">' + escapeHtml(item.name) + '</td>' +
          '<td class="cart-cell">' + formatPrice(item.price) + '</td>' +
          '<td class="cart-cell">' +
            '<div class="qty-control">' +
              '<button data-accion="menos" data-id="' + id + '" aria-label="Restar uno">&#8722;</button>' +
              '<span>' + item.qty + '</span>' +
              '<button data-accion="mas" data-id="' + id + '" aria-label="Sumar uno">+</button>' +
            '</div>' +
          '</td>' +
          '<td class="cart-cell">' + formatPrice(item.price * item.qty) + '</td>' +
          '<td class="cart-cell cart-remove">' +
            '<button data-accion="quitar" data-id="' + id + '" aria-label="Eliminar producto">&#215;</button>' +
          '</td>' +
        '</tr>';
      }).join('');

      totalEl.textContent = formatPrice(cartTotal());
    }

    /* Delegación de eventos: un solo listener para toda la tabla */
    bodyEl.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-accion]');
      if (!btn) return;

      var id     = btn.getAttribute('data-id');
      var actual = cartGet().find(function (i) { return i.id === id; });
      if (!actual) return;

      if (btn.dataset.accion === 'mas')    cartSetQty(id, actual.qty + 1);
      if (btn.dataset.accion === 'menos')  cartSetQty(id, actual.qty - 1);
      if (btn.dataset.accion === 'quitar') cartRemove(id);

      renderCart();
    });

    document.getElementById('btnVaciar').addEventListener('click', function () {
      if (confirm('¿Seguro que querés vaciar el carrito?')) {
        cartClear();
        renderCart();
      }
    });

    document.getElementById('btnComprar').addEventListener('click', function () {
      var sesion = getSession();
      document.getElementById('checkoutBody').innerHTML =
        'Gracias por tu compra' + (sesion ? ', ' + escapeHtml(sesion.nombre) : '') + '.<br/>' +
        'Total abonado: <strong>' + formatPrice(cartTotal()) + '</strong>.<br/>' +
        'Te vamos a contactar por correo para coordinar la entrega.';
      document.getElementById('checkoutModal').classList.add('active');
      cartClear();
      renderCart();
    });

    document.getElementById('btnSeguir').addEventListener('click', function () {
      window.location.href = 'index.html';
    });

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>

</body>
</html>
