<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RODEX — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body>

  <header class="header"></header>

  <main class="main">
    <div class="auth">

      <div class="auth__panel">
        <div class="auth__box">

          <p class="auth__eyebrow">Bienvenido de nuevo</p>
          <h1 class="auth__title">Iniciar sesión</h1>
          <p class="auth__subtitle">Ingresá para poder usar el carrito y comprar.</p>

          <form class="form" id="loginForm" novalidate>

            <div class="form__field">
              <label class="form__label" for="email">Correo electrónico</label>
              <input class="form__input" type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" />
            </div>

            <div class="form__field">
              <label class="form__label" for="password">Contraseña</label>
              <input class="form__input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
            </div>

            <button type="submit" class="button form__button">Ingresar</button>

            <p class="form__error" id="loginError"></p>

          </form>

          <p class="auth__footer">
            ¿No tenés cuenta?
            <a href="../register/register.html" class="auth__link">Registrate acá</a>
          </p>

        </div>
      </div>

      <div class="auth__visual">
        <p class="auth__visual-text">Rodex<br />Motors<br />Store</p>
      </div>

    </div>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
